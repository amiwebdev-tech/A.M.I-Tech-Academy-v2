<!DOCTYPE html>

<html>

<head>

<title>Certificate</title>

<style>

body{

    background: #0b1020;

    display: flex;

    justify-content: center;

    align-items: center;

    height: 100vh;

    font-family: Arial;

}

.certificate{

    background: white;

    width: 800px;

    padding: 50px;

    text-align: center;

    border: 10px solid gold;

    border-radius: 20px;

}

h1{

    font-size: 50px;

    color: #111;

}

h2{

    font-size: 22px;

    color: #222;

    margin-top: 20px;

}

p{

    font-size: 22px;

    color: #444;

}

.logo{

    font-size: 40px;

    font-weight: bold;

    color: gold;

    margin-bottom: 20px;

}

button{

    margin-top: 30px;

    padding: 15px 30px;

    background: gold;

    border: none;

    font-size: 18px;

    border-radius: 10px;

    cursor: pointer;

    font-weight: bold;

}

</style>

</head>

<body>

    <div class="certificate">

        <div class="logo">

            A.M.I TECH ACADEMY

        </div>

        <h1>CERTIFICATE</h1>

        <p>This certificate that</p>

        <h2 class="student-name"
        id="certificateName">
        Loading...
        </h2>

        <p>

            has successfully completed

            Frontend Development Course

        </p>

        <button onclick="window.print()">

            Download Certificate

        </button>

    </div>

</body>

</html>
