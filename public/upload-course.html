<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Upload Course</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

    <div class="upload-page">

        <div class="upload-container">

            <div class="upload-header">

                <h1>Upload New Course</h1>

                <p>
                    Create and publish professional learning courses.
                </p>

            </div>

            <form class="upload-form">

                <div class="form-group">

                    <label>Course Title</label>

                    <input type="text"
                    placeholder="Enter Course Title">

                </div>

                <div class="form-group">

                    <label>Instructor Name</label>

                    <input type="text"
                    placeholder="Instructor name">

                </div>

                <div class="form-group">

                    <lebel>Course Description</lebel>

                    <textarea
                    placeholder="Write course description"></textarea>

                </div>

                <div class="form-group">

                    <label>Course Thumbnail</label>

                    <input type="file">
                </div>

                <div class="form-group">

                    <lebel>Course Video</lebel>

                    <input type="file">
                </div>

                <div class="form-group">

                    <label>Category</label>

                    <select>

                        <option>Fronted Development</option>

                        <option>Backend Development</option>

                        <option>Artificial Intelligence</option>

                        <option>Cybersecurity</option>

                        <option>Mobile App Development</option>

                    </select>

                    <button type="submit"
                    class="publish-btn">

                     Publish Course

                </button>
                
            </form>

        </div>

        </div>

    </div>

</body>

</html>
