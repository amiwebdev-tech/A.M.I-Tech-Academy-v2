<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>A.M.I TECH ACADEMY</title>

<link rel="stylesheet"
href="style.css">
</head>

<body>

    <h1>My Learning Progress</h1>

    <div class="progress-card">

        <h2 id="percentage">
            0% Complete
        </h2>

        <p id="completedText">
            Lessons Completed: 0/3
        </p>

        <div id="lessonStatus"></div>

        <div id="certificateSection"></div>
    
    </div>

    <script type="module">

        import { db }
        from "./firebase.js";

        import {
            collection,
            getDocs
        }

        from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const percentage = 
        document.getElementById("percentage");

        const completedText = 
        document.getElementById("completedText");

        const lessonStatus = 
        document.getElementById("lessonStatus");

        const certificateSection = 
        document.getElementById("certificateSection");

        async function loadProgress() {

            try {
                const snapshot = await
                getDocs(collection(db, "progress"));

                const completed = 
                Number(snapshot?.size || 0);

                const totalLessons = 3

                const percent = totalLessons > 0
                ? Math.round((completed / totalLessons) * 100)
                :0;

                percentage.textContent = percent + "% complete";

                completedText.textContent = 
                "Lessons Completed: " + completed + "/" + totalLessons;

                let html = "";

                for (let i = 1; i <= totalLessons; i++) {
                    if (completed >= i) {
                        html += `<p> Lesson ${i} completed</p>`;
                    }
                }

                lessonStatus.innerHTML = html;

                if (completed === totalLessons) {
                    certificateSection.innerHTML = `
                    <div id="certificate"
                    class="certificate">

                    <div class="certificate-header">

                        <div class="ami-logo">
                            <div class="crest">
                                </div>

                    <h3>A.M.I TECH ACADEMY</h3>
                    </div>

                    <h2>CERTIFICATE OF COMPLETION</h2>

                    </div>

                        <P class="cert-text">
                        This certifies that
                        </p>

                            <h2 class="student-name">
                                STUDENT NAME
                            </h2>

                            <p class="cart-text">
                            has successfully completed the
                            </p>

                            <h3 class="course-name">
                            COMPUTER SCIENCE PROGRAM
                            </h3>

                            <p class="cart-text">
                            and demonstrated dedication,
                            innovation and excellence.
                            </p>

                            <div class="certificate-info">

                                <P class="cert-id">
                                    Certificate ID: AMI-2026-0001
                                </p>

                                    <p class="cert-date">
                                        Date: June 2026
                                    </p>

                                    </div>
                                    
                                    <div class="signatures">

                                        <div>
                                            ___________________
                                            <br>
                                            Founder
                                            <br>
                                            Ilekoin Ayo Modupe
                                        </div>

                                        <div>
                                            ____________________
                                            <br>
                                            Director
                                            <br>
                                            Ilekoin Ayo Modupe
                                        </div>

                                    </div>

                                    <button id="downloadCertificate">
                                        Download Certificate
                                    </button>

                                </div>
                                `;
                

                    document
                    .getElementById("downloadCertificate")
                    .addEventListener("click", () => {

                        const cert =
                        document.getElementById("certificate");

                        const text = cert.innerHTML;

                        const certificateText = 
                        `CERTIFICATE OF COMPLETION

                        A.M.I TECH ACADEMY

                        This certifies that

                        ____________________

                        has successfully completed all lessons.

                        Congratulations!
                        `;

                        const blob = new Blob(
                            [certificateText],
                            { type: "text/plain" }
                        );

                        const url = 
                        URL.createObjectURL(blob);

                        const a = 
                        document.createElement("a");

                        a.href = url;
                        a.download = "certificate.txt";

                        document.body.appendChild(a);
                        a.click();

                        URL.revokeObjectURL(url);

                    });
                } else {
                    certificateSection.innerHTML = "";
                }

                } catch (error) {
                    console.error("Error loading progress:", error);

                    percentage.textContent = "0% Complete";
                    completedText.textContent = "Lessons Completed: 0/3";
                    lessonStatus.innerHTML = "<p>Error loading progress</p>";
                }
            }
            
        loadProgress();

    </script>

</body>
</html>
