<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Register - A.M.I TECH</title>

    <link rel="stylesheet"
href="style.css">

    <link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

</head>

<body>

<div class="register-left">

    <h1>Create Account</h1>

    <p>
        Join A.M.I TECH and start learning future technology skills today.
    </p>

    <img src="images/register.jpg.jpg">

</div>

<div class="register-right">

    <form class="register-form">

        <h2>Student Registration</h2>

        <div class="input-box">

            <i class="fa-solid fa-user"></i>

            <input type="text"
            id="name"
            placeholder="Full Name" 
            required>

        </div>

        <div class="input-box">

            <i class="fa-solid fa-envelope"></i>

            <input type="email"
            id="email">

        </div>

        <div class="input-box">

            <i class="fa-solid fa-phone"></i>

            <input type="text"
            placeholder="Phone Number" required>

        </div>

        <div class="input-box">

            <i class="fa-solid fa-lock"></i>

            <input type="password"
            id="password">

        </div>

        <button type="submit"
        class="register-btn">
        Register
        </button>

    <p class="login-link">

        Already have an account?

        <a href="login.html">

            Login

        </a>

    </p>

    </form>

</div>

</body>

<script type="module"
src="firebase-config.js"></script>

<script type="module"
src="register.js">
</script>
</html>
