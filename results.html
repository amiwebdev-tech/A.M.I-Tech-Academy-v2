<!DOCTYPE html>
<html>
<head>

<title>My Results</title>

<style>

    body{
        background: #0f172a;
        color: white;
        font-family: Arial;
        padding: 20px;
    }

    .result-card{
        background: #1e293b;
        padding: 20px;
        border-radius: 10px;
        margin-bottom: 15px;
    }

</style>

</head>

<body>

    <h1>My Assignment Results</h1>

    <div id="resultsList"></div>

    <script type="module">

        import { initializeApp }
        from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getFirestore,
            collection,
            getDocs
        }
        from
        "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {

             apiKey: "AIzaSyCcYCySRQGErV3rnmK3xYLlFvUg2sSIejM",
             authDomain: "ami-tech-academy.firebaseapp.com",
             projectId: "ami-tech-academy",
             storageBucket: "ami-tech-academy.firebasestorage.app",
             messagingSenderId: "543291694831",
             appId: "1:543291694831:web:7b08ad33e99ee69b16451a",
             measurementId: "G-1ZZCTV5PP8"

        };

        const app = 
        initializeApp(firebaseConfig);

        const db = getFirestore(app);

        const resultsList =
        document.getElementById("resultsList");

        async function loadResults(){

            const querySnapshot = 
            await getDocs(
                collection(db,"assignments")
            );

            querySnapshot.forEach((doc)=>{

                const data = doc.data();

                resultsList.innerHTML += `

                <div class="result-card">

                    <h3>Assignment Result</h3>

                    <p>Score:
                        ${data.score || "Not Graded Yet"}</p>

                        </div>

                        `;

            });

        }

        loadResults();

    </script>

</body>
</html>
